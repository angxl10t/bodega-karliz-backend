<!DOCTYPE html>

  <script>
    // Soporte dinámico de base href para GitHub Pages (/bodega-karliz-backend/) y Render (/)
    (function() {
      var path = window.location.pathname;
      if (path.indexOf('/bodega-karliz-backend') === 0) {
        var baseTag = document.querySelector('base');
        if (baseTag) {
          baseTag.setAttribute('href', '/bodega-karliz-backend/');
        }
      } else if (path.startsWith('/bodega-sistema')) {
        var _sub = path.replace(/^\/bodega-sistema\/?/, '/') || '/';
        window.location.replace(_sub + window.location.search + window.location.hash);
      }
    })();
  </script>

  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-900.ttf') format('truetype'),
           url('assets/fonts/Outfit-900.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-800.ttf') format('truetype'),
           url('assets/fonts/Outfit-800.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }
    :root {
      --bg-color: #FFFFFF;
      --wordmark-grad: linear-gradient(135deg, #1D4ED8 0%, #2563EB 55%, #06B6D4 100%);
      --pos-bg: linear-gradient(135deg, #2563EB, #1D4ED8);
      --pos-color: #FFFFFF;
      --pos-shadow: rgba(37, 99, 235, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #090A0F;
        --wordmark-grad: linear-gradient(135deg, #38BDF8 0%, #2563EB 55%, #60A5FA 100%);
        --pos-bg: linear-gradient(135deg, #2563EB, #1D4ED8);
        --pos-color: #FFFFFF;
        --pos-shadow: rgba(37, 99, 235, 0.5);
      }
    }
    html, body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: 'Outfit', sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 999999;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }
    #loading-container.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .ambient-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.09) 0%, rgba(56, 189, 248, 0.03) 50%, transparent 72%);
      pointer-events: none;
      opacity: 0;
      animation: glowFade 0.4s ease forwards;
    }
    @media (prefers-color-scheme: dark) {
      .ambient-glow {
        background: radial-gradient(circle, rgba(37, 99, 235, 0.20) 0%, rgba(6, 182, 212, 0.07) 50%, transparent 72%);
      }
    }
    @keyframes glowFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 10;
      will-change: opacity, transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      animation: cleanEntrance 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cleanEntrance {
      0% {
        opacity: 0;
        transform: translate3d(0, 6px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    .logo-box {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: var(--pos-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px var(--pos-shadow);
      will-change: transform;
    }
    .logo-box svg {
      width: 27px;
      height: 27px;
      fill: #FFFFFF;
    }

    .wordmark-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .wordmark {
      font-family: 'Outfit', sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1.2px;
      line-height: 1;
      background: var(--wordmark-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }
    .pos-pill {
      display: inline-block;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.0px;
      line-height: 1;
      padding: 3.5px 8px;
      border-radius: 8px;
      background: var(--pos-bg);
      color: var(--pos-color);
      box-shadow: 0 4px 12px var(--pos-shadow);
      margin-bottom: 2px;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    .shimmer-container {
      position: absolute;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: glowFade 0.4s ease 0.15s forwards;
    }
    .shimmer-track {
      width: 110px;
      height: 3px;
      background: rgba(100, 116, 139, 0.18);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .shimmer-bar {
      position: absolute;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, transparent, #38BDF8, #60A5FA, transparent);
      border-radius: 10px;
      will-change: transform;
      animation: shimmerGlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .shimmer-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.3px;
    }

    @keyframes shimmerGlide {
      0% { transform: translate3d(-100%, 0, 0); }
      100% { transform: translate3d(240%, 0, 0); }
    }
  </style>
</head>
<body>

  <script>
    // Registro de Service Worker para habilitación de PWA e instalación en Escritorio (Chrome / Edge)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js?v=22').catch(function(err) {
          console.warn('PWA service worker registration notice:', err);
        });
      });
    }
  </script>

  <script>
    // Gestor de remoción del contenedor de carga (HTML -> Flutter Web)
    (function() {
      var dismissed = false;
      function dismissLoadingScreen() {
        if (dismissed) return;
        dismissed = true;
        var container = document.getElementById('loading-container');
        if (container) {
          container.classList.add('loaded');
          setTimeout(function() {
            if (container && container.parentNode) {
              container.parentNode.removeChild(container);
            }
          }, 380);
        }
      }
      window.dismissCajaYaLoader = dismissLoadingScreen;

      // 1. Observer: Detectar cuando Flutter monta elementos en el DOM
      function setupObserver() {
        if (!document.body) return;
        var observer = new MutationObserver(function(mutations, obs) {
          var flutterApp = document.querySelector('flutter-view') ||
                           document.querySelector('flt-glass-pane') ||
                           document.querySelector('flt-scene-host') ||
                           document.querySelector('flt-renderer');
          if (flutterApp) {
            obs.disconnect();
            requestAnimationFrame(function() {
              setTimeout(dismissLoadingScreen, 50);
            });
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupObserver);
      } else {
        setupObserver();
      }

      // 2. Evento estándar de Flutter si el browser lo dispara
      window.addEventListener('flutter-first-frame', dismissLoadingScreen);

      // 3. Fallback de seguridad: si pasan 3.5 segundos, forzar el desvanecimiento para evitar que quede perenne
      setTimeout(dismissLoadingScreen, 3500);
    })();
  </script>

  <script src="flutter_bootstrap.js?v=1.0.25_v22" async></script>
</body>
