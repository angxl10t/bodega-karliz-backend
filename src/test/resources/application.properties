spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_TEST_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cajaya_test}}
spring.datasource.username=${POSTGRES_TEST_USER:${SPRING_DATASOURCE_USERNAME:cajaya_test}}
spring.datasource.password=${POSTGRES_TEST_PASSWORD:${SPRING_DATASOURCE_PASSWORD:cajaya_test_password}}

# Configuracion de JPA / Hibernate para pruebas con PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Configuracion de Migraciones para pruebas
cajaya.migrations.enabled=true
cajaya.migrations.continue-on-error=true

# Seguridad y Seed en pruebas
jwt.secret=testSecretKeyForUnitTestingOnlyNotForProduction1234567890!
jwt.expiration-ms=86400000
cajaya.security.superadmin-password=Admin123*Test
cajaya.seed.demo-accounts=false
