spring.application.name=bodega-backend

# ===============================
# Configuración de Base de Datos (Supabase PostgreSQL)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rmdbcmnoanyqumjlfphy}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# Configuración del Pool HikariCP (Optimizado para Alta Concurrencia y Supabase Pooler)
# ===============================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:12}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:3}
spring.datasource.hikari.connection-timeout=25000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# Configuración de Inicialización de Esquema Multi-Tenant
# ===============================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/v1_multitenant_schema.sql,classpath:db/migration/v2_rls_and_refinement.sql,classpath:db/migration/v3_scalability_and_performance.sql,classpath:db/migration/v4_enterprise_subscriptions_and_integrity.sql,classpath:db/migration/v5_sunat_regimen_and_documents.sql,classpath:db/migration/v6_sunat_emission_fields.sql,classpath:db/migration/v7_nuevo_rus_and_integrity_alignment.sql,classpath:db/migration/v8_multitenant_indexes.sql,classpath:db/migration/v9_caja_chica_and_arqueo.sql,classpath:db/migration/v10_performance_optimizations.sql,classpath:db/migration/v11_producto_imagen_url.sql,classpath:db/migration/v12_control_inventario_y_mermas.sql,classpath:db/migration/v13_resilience_and_performance_tuning.sql,classpath:db/migration/v14_enable_rls_all_tables.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# Configuración de JPA / Hibernate (Alta Concurrencia y Resiliencia)
# ===============================
# Desactivación de Open-In-View (OSIV): Libera la conexión a la base de datos INMEDIATAMENTE
# al terminar el servicio @Transactional sin retenerla durante la serialización JSON / red.
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Solo muestra SQL si se habilita explícitamente por variable de entorno SHOW_SQL
spring.jpa.show-sql=${SHOW_SQL:false}
# "update" asegura que Hibernate cree tablas y columnas nuevas automáticamente sin abortar en runtime.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Optimización de Batching JDBC para inserciones masivas (ventas multi-ítem y catálogo)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# Configuración de Seguridad (JWT)
# ===============================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
# 86400000 ms = 24 horas (recomendado para turnos POS completos sin interrupción y ventana mínima de exposición)

# ===============================
# Configuración del Servidor y Tomcat (Protección contra OOM y Saturación de Hilos)
# ===============================
server.port=${PORT:8080}
# Hilos Tomcat ajustados para contenedor de 512MB RAM en Render
server.tomcat.threads.max=60
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=15000
# Optimización de Transferencia de Red y Compresión Gzip para clientes móviles y web
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/csv
server.compression.min-response-size=1024

# ===============================
# Configuración de Consulta de Documentos RENIEC / SUNAT (BFF)
# ===============================
peru.api.token=${PERU_API_TOKEN:}
peru.api.url.dni=${PERU_API_URL_DNI:https://api.apis.net.pe/v2/reniec/dni}
peru.api.url.ruc=${PERU_API_URL_RUC:https://api.apis.net.pe/v2/sunat/ruc}

# ===============================
# Integración SUNAT Telemática REST (UBL 2.1)
# ===============================
sunat.api.url=${SUNAT_API_URL:https://facturacion.apisperu.com/api/v1/invoice/send}
sunat.api.token=${SUNAT_API_TOKEN:}
sunat.api.modo-pruebas=${SUNAT_MODO_PRUEBAS:true}

# ===============================
# Configuración de Métricas y Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
