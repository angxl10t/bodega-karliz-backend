spring.application.name=bodega-backend

# ===============================
# Configuración de Base de Datos (Supabase PostgreSQL)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rmdbcmnoanyqumjlfphy}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# Configuración del Pool HikariCP (Optimizado para Supabase Free Tier)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000

# ===============================
# Configuración de JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Muestra las consultas SQL en consola (útil para debug)
spring.jpa.show-sql=true
# "validate" asegura que las entidades coincidan con la DB. 
# Usaremos scripts de migración SQL como pide el documento maestro.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Configuración de Seguridad (JWT)
# ===============================
# La clave secreta debe tener al menos 256 bits (32 caracteres). 
# Se inyecta por variable de entorno.
jwt.secret=${JWT_SECRET:secretKeyProvisionalParaDesarrolloQueDebeSerLarga1234567890}
jwt.expiration-ms=7776000000
# 7776000000 ms = 90 días (diseñado para operación continua en terminales POS)

# ===============================
# Configuración del Servidor
# ===============================
server.port=${PORT:8080}
