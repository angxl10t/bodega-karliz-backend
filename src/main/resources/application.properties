spring.application.name=bodega-backend

# ===============================
# Configuración de Base de Datos (Supabase PostgreSQL)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.rmdbcmnoanyqumjlfphy}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# Configuración del Pool HikariCP (Optimizado para Supabase Free Tier)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# Configuración de Inicialización de Esquema Multi-Tenant
# ===============================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/v1_multitenant_schema.sql,classpath:db/migration/v2_rls_and_refinement.sql,classpath:db/migration/v3_scalability_and_performance.sql,classpath:db/migration/v4_enterprise_subscriptions_and_integrity.sql,classpath:db/migration/v5_sunat_regimen_and_documents.sql,classpath:db/migration/v6_sunat_emission_fields.sql,classpath:db/migration/v7_nuevo_rus_and_integrity_alignment.sql,classpath:db/migration/v8_multitenant_indexes.sql,classpath:db/migration/v9_caja_chica_and_arqueo.sql,classpath:db/migration/v10_performance_optimizations.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# Configuración de JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Solo muestra SQL si se habilita explícitamente por variable de entorno SHOW_SQL
spring.jpa.show-sql=${SHOW_SQL:false}
# "update" asegura que Hibernate cree tablas y columnas nuevas (bodegas, id_bodega) automáticamente sin abortar en runtime.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Optimización de Batching JDBC para inserciones masivas (ventas multi-ítem y catálogo)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# Configuración de Seguridad (JWT)
# ===============================
# La clave secreta debe tener al menos 256 bits (32 caracteres). 
# Se inyecta obligatoriamente por variable de entorno JWT_SECRET (sin fallbacks inseguros en código).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000
# 86400000 ms = 24 horas (recomendado para turnos POS completos sin interrupción y ventana mínima de exposición)

# ===============================
# Configuración del Servidor
# ===============================
server.port=${PORT:8080}
# Optimización de Transferencia de Red y Compresión Gzip para clientes móviles y web
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/csv
server.compression.min-response-size=1024

# ===============================
# Configuración de Consulta de Documentos RENIEC / SUNAT (BFF)
# ===============================
peru.api.token=${PERU_API_TOKEN:}
peru.api.url.dni=${PERU_API_URL_DNI:https://api.apis.net.pe/v2/reniec/dni}
peru.api.url.ruc=${PERU_API_URL_RUC:https://api.apis.net.pe/v2/sunat/ruc}

# ===============================
# Configuración de Emisión Facturación Electrónica SUNAT (API REST)
# ===============================
sunat.api.url=${SUNAT_API_URL:https://facturacion.apisperu.com/api/v1/invoice/send}
sunat.api.token=${SUNAT_API_TOKEN:}
sunat.api.modo-pruebas=${SUNAT_MODO_PRUEBAS:true}
