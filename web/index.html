<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Soporte dinámico de base href para GitHub Pages (/bodega-karliz-backend/) y Render (/)
    (function() {
      var path = window.location.pathname;
      if (path.indexOf('/bodega-karliz-backend') === 0) {
        var baseTag = document.querySelector('base');
        if (baseTag) {
          baseTag.setAttribute('href', '/bodega-karliz-backend/');
        }
      } else if (path.startsWith('/bodega-sistema')) {
        var _sub = path.replace(/^\/bodega-sistema\/?/, '/') || '/';
        window.location.replace(_sub + window.location.search + window.location.hash);
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <title>CajaYa POS - Punto de Venta & Control de Inventario</title>

  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-900.ttf') format('truetype'),
           url('assets/fonts/Outfit-900.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-800.ttf') format('truetype'),
           url('assets/fonts/Outfit-800.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
    }
    :root {
      --bg-color: #FFFFFF;
      --wordmark-grad: linear-gradient(135deg, #1D4ED8 0%, #2563EB 55%, #06B6D4 100%);
      --pos-bg: linear-gradient(135deg, #2563EB, #1D4ED8);
      --pos-color: #FFFFFF;
      --pos-shadow: rgba(37, 99, 235, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #090A0F;
        --wordmark-grad: linear-gradient(135deg, #38BDF8 0%, #2563EB 55%, #60A5FA 100%);
        --pos-bg: linear-gradient(135deg, #2563EB, #1D4ED8);
        --pos-color: #FFFFFF;
        --pos-shadow: rgba(37, 99, 235, 0.5);
      }
    }
    html, body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: 'Outfit', sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 999999;
      pointer-events: auto;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity;
    }
    #loading-container.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .ambient-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.09) 0%, rgba(56, 189, 248, 0.03) 50%, transparent 72%);
      pointer-events: none;
      opacity: 0;
      animation: glowFade 0.4s ease forwards;
    }
    @media (prefers-color-scheme: dark) {
      .ambient-glow {
        background: radial-gradient(circle, rgba(37, 99, 235, 0.20) 0%, rgba(6, 182, 212, 0.07) 50%, transparent 72%);
      }
    }
    @keyframes glowFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      position: relative;
      z-index: 10;
      will-change: opacity, transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
    }
    .real-app-icon {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      z-index: 20;
      position: relative;
      background-color: #2563EB;
      filter: drop-shadow(0 8px 20px rgba(37, 99, 235, 0.40));
      animation: iconEntrance 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }
    @keyframes iconEntrance {
      0% {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(0.88);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .wordmark-mask {
      overflow: hidden;
      display: flex;
      align-items: center;
      white-space: nowrap;
      margin-left: 0px;
      width: 0px;
      opacity: 0;
      animation: maskExpand 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
      will-change: width, opacity;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }
    @keyframes maskExpand {
      0% {
        width: 0px;
        opacity: 0;
      }
      100% {
        width: 220px;
        opacity: 1;
      }
    }

    .wordmark-rail {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-left: 12px;
      transform: translate3d(-85%, 0, 0);
      animation: textPush 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
      will-change: transform;
      -webkit-backface-visibility: hidden;
    }
    @keyframes textPush {
      0% {
        transform: translate3d(-85%, 0, 0);
      }
      100% {
        transform: translate3d(0, 0, 0);
      }
    }

    .wordmark {
      font-family: 'Outfit', sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1.2px;
      line-height: 1;
      color: #2563EB;
      background: var(--wordmark-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0, 0, 0);
    }
    .pos-pill {
      display: inline-block;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.0px;
      line-height: 1;
      padding: 3.5px 8px;
      border-radius: 8px;
      background: var(--pos-bg);
      color: var(--pos-color);
      box-shadow: 0 4px 12px var(--pos-shadow);
      margin-bottom: 2px;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      animation: posPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.75s forwards;
      will-change: transform;
    }
    @keyframes posPop {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.10);
      }
      100% {
        transform: scale(1);
      }
    }

    .shimmer-container {
      position: absolute;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: glowFade 0.4s ease 0.15s forwards;
    }
    .shimmer-track {
      width: 110px;
      height: 3px;
      background: rgba(100, 116, 139, 0.18);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .shimmer-bar {
      position: absolute;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, transparent, #38BDF8, #60A5FA, transparent);
      border-radius: 10px;
      will-change: transform;
      animation: shimmerGlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .shimmer-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.3px;
    }

    @keyframes shimmerGlide {
      0% { transform: translate3d(-100%, 0, 0); }
      100% { transform: translate3d(240%, 0, 0); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="ambient-glow"></div>
    <div class="brand-mark">
      <img src="icons/cajaya_icon.png" alt="CajaYa POS" class="real-app-icon">
      <div class="wordmark-mask">
        <div class="wordmark-rail">
          <span class="wordmark">CajaYa</span>
          <span class="pos-pill">POS</span>
        </div>
      </div>
    </div>
    <div class="shimmer-container">
      <div class="shimmer-track">
        <div class="shimmer-bar"></div>
      </div>
      <span class="shimmer-label">Iniciando terminal...</span>
    </div>
  </div>


  <script>
    // Registro de Service Worker para habilitación de PWA e instalación en Escritorio (Chrome / Edge)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js?v=22').catch(function(err) {
          console.warn('PWA service worker registration notice:', err);
        });
      });
    }
  </script>

  <script>
    // Gestor determinista y sincronizado de remoción (Exactamente 1.8s)
    (function() {
      var dismissed = false;
      var minTimePassed = false;
      var flutterReady = false;

      function performDismiss() {
        if (dismissed) return;
        dismissed = true;
        var container = document.getElementById('loading-container');
        if (container) {
          container.classList.add('loaded');
          setTimeout(function() {
            if (container && container.parentNode) {
              container.parentNode.removeChild(container);
            }
          }, 380);
        }
      }

      function checkAndDismiss() {
        if (minTimePassed && flutterReady) {
          performDismiss();
        }
      }

      // 1. Garantizar presencia de marca de exactamente 1.8 segundos (1800ms)
      setTimeout(function() {
        minTimePassed = true;
        checkAndDismiss();
      }, 1800);

      // Invocado por Flutter cuando monta su primer frame y prepara la ruta
      window.dismissCajaYaLoader = function() {
        flutterReady = true;
        checkAndDismiss();
      };

      // 2. Observer: Detectar cuando Flutter monta elementos en el DOM
      function setupObserver() {
        if (!document.body) return;
        var observer = new MutationObserver(function(mutations, obs) {
          var flutterApp = document.querySelector('flutter-view') ||
                           document.querySelector('flt-glass-pane') ||
                           document.querySelector('flt-scene-host') ||
                           document.querySelector('flt-renderer');
          if (flutterApp) {
            obs.disconnect();
            flutterReady = true;
            checkAndDismiss();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupObserver);
      } else {
        setupObserver();
      }

      window.addEventListener('flutter-first-frame', function() {
        flutterReady = true;
        checkAndDismiss();
      });

      // 3. Fallback de seguridad absoluto (4.0s)
      setTimeout(function() {
        minTimePassed = true;
        flutterReady = true;
        performDismiss();
      }, 4000);
    })();
  </script>

  <script src="flutter_bootstrap.js?v=1.0.25_v22" async></script>
</body>
</html>
